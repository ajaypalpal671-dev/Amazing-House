# Netlify Build and Routing Configuration for Vite React SPA

[build]
  # Directory that contains the deploy-ready files after build
  publish = "dist"
  # Default build command
  command = "npm run build"

# SPA Routing: Redirect all routes to index.html with a 200 HTTP status
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control and security headers for modern web apps
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
